[package]
name = "assistant-core"
version = "0.1.0"
edition = "2024"

[dependencies]
fitness-core = { path = "../fitness-core" }
todo-core = { path = "../todo-core" }
shopping-core = { path = "../shopping-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tokio.workspace = true
# Plain HTTP to a local Ollama; no TLS (it is `http://127.0.0.1:11434` or a tailnet address).
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }

[dev-dependencies]
axum.workspace = true
