<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Household</title>
    <style>
      :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --muted: #666; --line: #ddd; --accent: #2563eb; --bad: #c62828; --ok: #2e7d32; }
      @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #161616; --muted: #999; --line: #333; --accent: #60a5fa; --bad: #ef5350; --ok: #66bb6a; } }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
      #app { max-width: 640px; margin: 0 auto; padding: 12px 16px 64px; }
      nav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
      nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
      nav.sub button { min-height: 40px; padding: 4px 10px; font-size: 15px; }
      button, input, select, textarea { font: inherit; min-height: 48px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
      button { cursor: pointer; }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      button:disabled { opacity: 0.5; }
      form, .card { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .row > input, .row > select { flex: 1 1 110px; min-width: 0; }
      .muted { color: var(--muted); font-size: 14px; }
      .bad { color: var(--bad); }
      .ok { color: var(--ok); }
      .done { text-decoration: line-through; color: var(--muted); }
      .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .stepper { display: flex; align-items: center; gap: 4px; }
      .stepper span { width: 64px; }
      .stepper button { min-width: 56px; font-size: 22px; }
      .stepper input { width: 96px; text-align: center; }
      .plan-row { display: grid; grid-template-columns: 44px 1fr 1fr; gap: 6px; align-items: start; }
      .plan-row > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      #error { position: sticky; top: 0; z-index: 10; }
      #error:not(:empty) { background: var(--bg); border: 2px solid var(--bad); border-radius: 10px; padding: 10px 12px; margin: 8px auto; max-width: 640px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      #error .msg { flex: 1; color: var(--bad); white-space: pre-wrap; }
      h2 { margin: 12px 0 4px; font-size: 18px; }
      .chart { overflow: hidden; }
      #app { padding-bottom: 96px; }
      .rec { font-weight: 600; color: var(--accent); }
      .item { padding: 6px 0; border-top: 1px solid var(--line); }
      .item:first-of-type { border-top: 0; }
      details > summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
      .card.inner { background: color-mix(in srgb, var(--line) 25%, transparent); margin: 4px 0; }
      .check { display: flex; align-items: center; gap: 8px; min-height: 44px; }
      .check input { min-height: 0; width: 22px; height: 22px; }
      .chip { min-height: 40px; padding: 4px 12px; border-radius: 20px; }
      .chip.ok { color: var(--ok); border-color: var(--ok); }
      .weekrow { display: grid; grid-template-columns: 44px repeat(4, minmax(0, 1fr)); gap: 4px; align-items: center; margin: 4px 0; }
      .weekrow input, .weekrow button { min-height: 40px; padding: 4px 6px; min-width: 0; }
      .weekrow:has(button) { grid-template-columns: 44px 1fr 1fr auto auto; }
      fieldset.muscles { border: 1px solid var(--line); border-radius: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 10px; }
      .chip-check { display: flex; align-items: center; gap: 4px; min-height: 36px; }
      .chip-check input { min-height: 0; width: 20px; height: 20px; }
      .bars { gap: 2px; }
      .barrow { display: grid; grid-template-columns: 96px 1fr 40px; gap: 8px; align-items: center; min-height: 40px; padding: 2px 8px; text-align: left; border-color: transparent; }
      .barrow.sel { border-color: var(--accent); }
      .bartrack { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; display: block; }
      .bar { display: block; height: 100%; background: var(--accent); }
      .barval { text-align: right; }
      .item-row { flex-direction: row; align-items: center; gap: 10px; padding: 8px 12px; margin: 4px 0; }
      .item-row .name { font-size: 18px; }
      .item-row.ticked .name { text-decoration: line-through; color: var(--muted); }
      .item-row.busy { opacity: 0.5; }
      button.tick { min-width: 64px; min-height: 64px; font-size: 30px; line-height: 1; padding: 0; }
      .item-row.ticked button.tick { color: var(--ok); border-color: var(--ok); }
      h3.cat { margin: 14px 0 2px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
      .who { margin-left: auto; white-space: nowrap; align-self: center; }
      .chat { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; margin: 8px 0; }
      .bubble { padding: 10px 12px; border-radius: 14px; max-width: 94%; white-space: pre-wrap; overflow-wrap: anywhere; }
      .bubble.user { align-self: flex-end; background: var(--accent); color: #fff; }
      .bubble.assistant { border: 1px solid var(--line); }
      .tools { margin-top: 6px; white-space: normal; }
      .tool { margin: 6px 0; font-size: 13px; }
      pre.json { max-height: 220px; overflow: auto; font-size: 12px; margin: 4px 0; padding: 8px; border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
      #rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--bg); border-top: 3px solid var(--accent); font-size: 18px; font-variant-numeric: tabular-nums; }
      #rest[hidden] { display: none; }
      #rest.over { border-top-color: var(--ok); color: var(--ok); }
    </style>
  </head>
  <body>
    <div id="error" role="alert"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
