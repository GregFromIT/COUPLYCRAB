[workspace]
resolver = "2"
members = ["crates/sync", "crates/todo-core", "crates/fitness-core", "crates/peer", "app/src-tauri", "crates/web"]

[workspace.dependencies]
automerge = "=0.12.0"
autosurgeon = "=0.14.0"
uuid = { version = "=1.28.0", features = ["v7", "v4"] }
tokio = { version = "=1.53.2", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
serde_json = "=1.0.154"
axum = "=0.8.9"
chrono-tz = "=0.10.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
tauri = "=2.12.3"
tauri-build = "=2.7.2"
