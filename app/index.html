<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Household</title>
    <style>
      :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --muted: #666; --line: #ddd; --accent: #2563eb; --bad: #c62828; }
      @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #161616; --muted: #999; --line: #333; --accent: #60a5fa; --bad: #ef5350; } }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
      #app { max-width: 640px; margin: 0 auto; padding: 12px 16px 48px; }
      nav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
      nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
      button, input, select, textarea { font: inherit; min-height: 48px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
      button { cursor: pointer; }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      form, .card { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .row > input, .row > select { flex: 1 1 120px; min-width: 0; }
      .muted { color: var(--muted); font-size: 14px; }
      .bad { color: var(--bad); }
      .done { text-decoration: line-through; color: var(--muted); }
      .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .stepper { display: flex; align-items: center; gap: 4px; }
      .stepper span { width: 64px; }
      .stepper button { min-width: 56px; font-size: 22px; }
      .stepper input { width: 96px; text-align: center; }
      #error { color: var(--bad); white-space: pre-wrap; }
      h2 { margin: 12px 0 4px; font-size: 18px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
